name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var PROXY_BASE_URL:${{ secrets.PROXY_BASE_URL }} --var UBO_PROXY_BASE_URL:${{ secrets.UBO_PROXY_BASE_URL }}
          secrets: |
            HMAC_SECRET
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
